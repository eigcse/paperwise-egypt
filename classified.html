<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classified past papers — Paperwise Egypt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 34'%3E%3Cpath d='M20 3 L37 31 H3 Z' fill='%23D4A63A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="classified">
<header id="site-head"></header>

<section class="banner"><div class="wrap" style="flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:8px">
<p class="kicker">Mathematics 0580</p>
<h1>Classified past papers <span lang="ar" dir="rtl" style="color:var(--gold)">· امتحانات مبوبة</span></h1>
<p>Past-paper questions grouped by topic, so you can drill one chapter at a time.</p>
</div>
<div role="group" aria-label="Level" id="levels" style="display:inline-flex;padding:4px;background:var(--nile2);border-radius:12px;gap:4px"></div>
</div></section>

<div class="wrap split">
<nav class="side card" aria-label="Topics" id="topics" style="padding:14px;display:flex;flex-direction:column;gap:4px"></nav>
<main class="main">
<section class="card" style="display:flex;flex-direction:column;gap:14px">
<h2 id="tname" style="margin:0;font-size:28px;font-weight:900;color:var(--nile)"></h2>
<div class="chips" id="subs"></div>
</section>
<h3 style="margin:0;font-size:20px;color:var(--nile)" id="bhead"></h3>
<div class="grid" id="booklets" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"></div>
<section class="card" style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><h3 style="margin:0;font-size:20px;color:var(--nile)">Quick topic check</h3><span id="qscore" style="font-weight:700;color:var(--terra)"></span></div>
<p style="margin:0;font-size:14px;color:var(--muted)">Tap an answer to see straight away if you’re right.</p>
<div id="quick" class="stack" style="gap:12px"></div>
<a class="btn btn-terra" href="quiz.html" style="align-self:flex-start">Take the full 50-question quiz</a>
</section>
</main>
</div>

<footer id="site-foot"></footer>
<script src="common.js"></script>
<script src="questions.js"></script>
<script>
var T = [
  ['number','Number','الأعداد',['Number'],['Types of number','Sets','Powers & roots','Fractions, decimals & percentages','Standard form','Estimation & bounds','Ratio & proportion','Rates & money','Exponential growth & decay']],
  ['algebra','Algebra and graphs','الجبر والتمثيل البياني',['Algebra','Functions','Sequences'],['Expressions & formulae','Expanding & factorising','Equations','Inequalities','Sequences','Indices','Graphs of functions','Functions']],
  ['coordinate-geometry','Coordinate geometry','الهندسة الإحداثية',['Coordinate geometry'],['Coordinates','Gradient','Equation of a line','Midpoint & length','Parallel & perpendicular lines']],
  ['geometry','Geometry','الهندسة',['Geometry'],['Angles & polygons','Constructions','Similarity','Symmetry','Circle theorems','Bearings']],
  ['mensuration','Mensuration','القياس',['Mensuration'],['Units','Perimeter & area','Circles, arcs & sectors','Surface area & volume','Compound shapes']],
  ['trigonometry','Trigonometry','حساب المثلثات',['Trigonometry'],['Pythagoras’ theorem','Right-angled triangles','Sine & cosine rules','Area of a triangle','3D trigonometry']],
  ['vectors-transformations','Transformations and vectors','التحويلات والمتجهات',['Vectors'],['Reflection','Rotation','Translation','Enlargement','Vector notation','Magnitude']],
  ['probability','Probability','الاحتمالات',['Probability'],['Probability scale','Relative frequency','Combined events','Tree diagrams','Venn diagrams','Conditional probability']],
  ['statistics','Statistics','الإحصاء',['Statistics'],['Averages & range','Charts & diagrams','Scatter diagrams','Cumulative frequency','Histograms']]
];
var PT = { 1: 'Paper 1 (Core, non-calculator)', 2: 'Paper 2 (Extended, non-calculator)', 3: 'Paper 3 (Core, calculator)', 4: 'Paper 4 (Extended, calculator)' };
var st = { topic: 0, level: 'ext', picks: {} };
var $ = function (id) { return document.getElementById(id); };
function render() {
  var t = T[st.topic], ext = st.level === 'ext';
  $('levels').innerHTML = [['core','Core'],['ext','Extended']].map(function (l) {
    var on = st.level === l[0];
    return '<button type="button" class="btn" data-l="' + l[0] + '" aria-pressed="' + on + '" style="' + (on ? 'background:var(--gold);color:var(--ink)' : 'background:transparent;color:#E6EEF5') + '">' + l[1] + '</button>';
  }).join('');
  $('topics').innerHTML = T.map(function (x, i) {
    return '<button type="button" class="opt" data-t="' + i + '" aria-current="' + (i === st.topic) + '" style="display:flex;justify-content:space-between;align-items:center;min-height:56px;border:0"><span><span style="display:block">' + x[1] + '</span><span lang="ar" dir="rtl" style="font-size:13px;opacity:.8">' + x[2] + '</span></span><span style="font-size:13px">' + (i + 1) + '</span></button>';
  }).join('');
  $('tname').innerHTML = 'Topic ' + (st.topic + 1) + ': ' + t[1] + ' <span lang="ar" dir="rtl" style="font-size:20px;color:var(--gold-text)">' + t[2] + '</span>';
  $('subs').innerHTML = t[4].map(function (s) { return '<span style="padding:6px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600">' + s + '</span>'; }).join('');
  $('bhead').textContent = 'Classified booklets, ' + (ext ? 'Extended' : 'Core');
  $('booklets').innerHTML = (ext ? [2, 4] : [1, 3]).map(function (p) {
    var f = '0580_' + t[0] + '_p' + p;
    return '<div class="card" style="border-top:4px solid var(--gold);display:flex;flex-direction:column;gap:12px"><div><div style="font-size:18px;font-weight:800">' + t[1] + ', ' + PT[p] + '</div><div class="file">' + f + '_qp.pdf</div></div>' +
      '<p style="margin:0;font-size:14px;color:var(--muted)">Every ' + t[1].toLowerCase() + ' question from Paper ' + p + ', with answers in a separate PDF.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-nile" target="_blank" rel="noopener" href="' + CLASSIFIED_BASE + f + '_qp.pdf">Questions PDF</a><a class="btn" style="background:var(--soft);color:#6B3F00" target="_blank" rel="noopener" href="' + CLASSIFIED_BASE + f + '_ms.pdf">Answers PDF</a></div></div>';
  }).join('');
  var right = 0, done = 0;
  var list = QUESTIONS.map(function (q, i) { return [q, i]; }).filter(function (x) { return t[3].indexOf(x[0][0]) > -1; });
  $('quick').innerHTML = list.map(function (x) {
    var q = x[0], i = x[1], pick = st.picks[i], ans = pick !== undefined;
    if (ans) { done++; if (pick === q[3]) right++; }
    return '<div style="padding:18px;border-radius:12px;background:var(--sand);display:flex;flex-direction:column;gap:10px"><p style="margin:0;font-size:17px;font-weight:700">' + q[1] + '</p>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">' + q[2].map(function (o, j) {
        var c = ans && j === q[3] ? ' right' : ans && j === pick ? ' wrong' : '';
        return '<button type="button" class="qbtn' + c + '" data-q="' + i + '" data-j="' + j + '">' + o + '</button>';
      }).join('') + '</div>' +
      (ans ? '<p style="margin:0;font-weight:700;color:' + (pick === q[3] ? '#1F5F3A' : '#8A2E17') + '">' + (pick === q[3] ? 'Correct — أحسنت!' : 'Not quite, the answer is ' + q[2][q[3]]) + '</p>' : '') + '</div>';
  }).join('') || '<p style="margin:0;color:var(--muted)">No quick-check questions for this topic yet.</p>';
  $('qscore').textContent = done ? right + ' / ' + done + ' correct' : list.length + ' questions';
}
$('levels').onclick = function (e) { var b = e.target.closest('[data-l]'); if (b) { st.level = b.getAttribute('data-l'); render(); } };
$('topics').onclick = function (e) { var b = e.target.closest('[data-t]'); if (b) { st.topic = +b.getAttribute('data-t'); render(); } };
$('quick').onclick = function (e) { var b = e.target.closest('[data-q]'); if (b) { st.picks[b.getAttribute('data-q')] = +b.getAttribute('data-j'); render(); } };
render();
</script>
</body>
</html>
